server:
  port: 5010
spring:

  datasource:
    url: jdbc:mysql://localhost:3306/airline_payment_db
    username: root
    password: YOUR_DB_PASSWORD


  kafka:
    bootstrap-servers: localhost:9092

# Razorpay is currently disabled.
# We are using Mock Payment Gateway for local development.

razorpay:
  api:
    key: YOUR_RAZORPAY_KEY
    secret: YOUR_RAZORPAY_SECRET

  callback:
    base-url: http://localhost:5173


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

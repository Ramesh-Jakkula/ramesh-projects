# =============================================================================
# Airline Microservices - Docker Compose
# =============================================================================
# Exposed to your machine:
#   - API Gateway      -> localhost:5000
#   - Eureka dashboard -> localhost:8761 (handy while testing)
#   - MySQL DBs        -> 127.0.0.1:33xx (localhost only, for debugging)
# Everything else is internal to the airline-net network.
# =============================================================================

services:

  # ===========================================================================
  # DATABASES
  # ===========================================================================

  userdb:
    image: mysql:8.0
    container_name: userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3302:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_user_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  airlinecoredb:
    image: mysql:8.0
    container_name: airlinecoredb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3303:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_core_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  flightopsdb:
    image: mysql:8.0
    container_name: flightopsdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3304:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_flight_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  locationdb:
    image: mysql:8.0
    container_name: locationdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_location_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  seatdb:
    image: mysql:8.0
    container_name: seatdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_seat_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  pricingdb:
    image: mysql:8.0
    container_name: pricingdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_pricing_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  ancillarydb:
    image: mysql:8.0
    container_name: ancillarydb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_ancillary_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  bookingdb:
    image: mysql:8.0
    container_name: bookingdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_booking_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  paymentdb:
    image: mysql:8.0
    container_name: paymentdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_payment_db
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airline-net

  # ===========================================================================
  # REDIS (used by location-service; also wired to gateway/core/flight/pricing)
  # ===========================================================================

  redis:
    image: redis:7.2-alpine
    container_name: gds-redis
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - airline-net

  # ===========================================================================
  # KAFKA (KRaft mode, internal only)
  # ===========================================================================

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"
    networks:
      - airline-net

  # ===========================================================================
  # CONFIG SERVER
  # ===========================================================================

  config-server:
    image: "jram224/gds-config-server:1.0.0"
    container_name: gds-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/Ramesh-Jakkula/airline-config-server"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - airline-net

  # ===========================================================================
  # SERVICE REGISTRY (Eureka)
  # ===========================================================================

  service-registry:
    image: "jram224/gds-service-registry:1.0.0"
    container_name: gds-eureka-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - airline-net

  # ===========================================================================
  # API GATEWAY
  # ===========================================================================

  api-gateway:
    image: "jram224/gds-api-gateway:1.0.0"
    container_name: gds-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airline-net

  # ===========================================================================
  # BUSINESS SERVICES (internal only)
  # ===========================================================================

  user-service:
    image: "jram224/gds-user:1.0.0"
    container_name: gds-user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      userdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/airline_user_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airline-net

  airline-core-service:
    image: "jram224/gds-airline:1.0.0"
    container_name: gds-airline-core-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      airlinecoredb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "airline-core-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://airlinecoredb:3306/airline_core_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airline-net

  flight-ops-service:
    image: "jram224/gds-flight:1.0.0"
    container_name: gds-flight-ops-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      flightopsdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "flight-ops-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://flightopsdb:3306/airline_flight_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airline-net

  location-service:
    image: "jram224/gds-location:1.0.0"
    container_name: gds-location-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      locationdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "location-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://locationdb:3306/airline_location_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airline-net

  seat-service:
    image: "jram224/gds-seat:1.0.0"
    container_name: gds-seat-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888/

server:
  port: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info